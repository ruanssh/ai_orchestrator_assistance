[project]
name = "sqms-ai-orchestrator"
version = "0.1.0"
description = "Modular AI orchestration and retrieval service for SQMS"
requires-python = ">=3.11"
dependencies = [
  "bm25s>=0.2.0,<0.3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.4,<1",
  "pydantic-settings>=2.5,<3",
  "python-frontmatter>=1.1,<2",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
semantic = [
  "numpy>=1.26,<3",
  "sentence-transformers>=5,<6",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
sqms-ai = "sqms_ai_orchestrator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqms_ai_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
